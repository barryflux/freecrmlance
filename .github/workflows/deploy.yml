name: Deploy Alouva
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY to confirm a production deployment'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: alouva-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish and build migration bundle
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/ef-tools" dotnet-ef --version 9.0.9
          dotnet publish src/Freecrmlance.Web/Freecrmlance.Web.csproj -c Release -o "$RUNNER_TEMP/publish"
          "$RUNNER_TEMP/ef-tools/dotnet-ef" migrations bundle \
            --project src/Freecrmlance.Infrastructure/Freecrmlance.Infrastructure.csproj \
            --startup-project src/Freecrmlance.Web/Freecrmlance.Web.csproj \
            --configuration Release \
            --self-contained \
            --runtime linux-x64 \
            --output "$RUNNER_TEMP/publish/efbundle"
          chmod 755 "$RUNNER_TEMP/publish/efbundle"
          tar -C "$RUNNER_TEMP/publish" -czf "$RUNNER_TEMP/release.tar.gz" .
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Transfer and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -o StrictHostKeyChecking=yes "$RUNNER_TEMP/release.tar.gz" "$VPS_USER@$VPS_HOST:/var/lib/alouva-deploy/release.tar.gz"
          ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'sudo -n /usr/local/sbin/deploy-alouva'
